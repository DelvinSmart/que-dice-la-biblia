# Panel de edición (Pages CMS, https://app.pagescms.org).
# Cada estudio es un archivo JSON en estudios/. Al guardar en el panel, GitHub publica la página sola.

content:
  - name: estudios
    label: Estudios bíblicos
    type: collection
    path: estudios
    format: json
    filename: "{primary}.json"
    view:
      primary: titulo
      fields: [titulo, idioma]
    fields:
      - name: titulo
        label: Título del estudio
        type: string
        required: true
      - name: idioma
        label: Idioma
        type: select
        required: true
        options:
          values:
            - name: es
              label: Español
            - name: pt
              label: Português
      - name: otro_idioma
        label: El mismo estudio en el otro idioma
        description: Nombre del archivo del estudio traducido, sin .json (por ejemplo linguas-estranhas). Déjalo vacío si no hay traducción.
        type: string
      - name: descripcion
        label: Descripción corta
        description: Una o dos frases. Aparece en la página de inicio.
        type: text
      - name: preguntas
        label: Preguntas de la portada
        type: string
        list: true
      - name: cierre
        label: Frase después de las preguntas
        description: Por ejemplo "Y bien!"
        type: string
      - name: temas
        label: Temas
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{index}. {titulo}"
        fields:
          - name: titulo
            label: Título del tema
            type: string
            required: true
          - name: subtitulo
            label: Subtítulo (pequeño, encima del título)
            type: string
          - name: color
            label: Color
            type: select
            options:
              values:
                - name: morado
                  label: Morado
                - name: verde
                  label: Verde
                - name: amarillo
                  label: Amarillo
                - name: naranja
                  label: Naranja
                - name: rosado
                  label: Rosado
                - name: azul
                  label: Azul
          - name: puntos
            label: Puntos
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{index}. {titulo}"
            fields:
              - name: titulo
                label: Título del punto
                type: string
                required: true
              - name: nuevo
                label: Marcar como nuevo
                type: boolean
              - name: bloques
                label: Contenido
                type: block
                list: true
                blockKey: tipo
                blocks:
                  - name: texto
                    label: Texto
                    fields:
                      - name: texto
                        label: Texto
                        type: rich-text
                        options:
                          format: html
                  - name: pasaje
                    label: Pasaje bíblico
                    fields:
                      - name: referencia
                        label: Referencia y versión
                        description: Por ejemplo "Hechos 2:1-11 LBLA"
                        type: string
                      - name: versiculos
                        label: Versículos
                        type: object
                        list: true
                        fields:
                          - name: numero
                            label: Número
                            type: string
                          - name: texto
                            label: Texto del versículo
                            type: text
                  - name: subtitulo
                    label: Subtítulo
                    fields:
                      - name: texto
                        label: Subtítulo
                        type: string
